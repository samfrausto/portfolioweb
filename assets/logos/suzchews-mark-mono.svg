<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="SuzChews">
  <title>SuzChews</title>
  <!--
    Single-ink SuzChews mark. Everything is currentColor, and the flower and
    the dispenser door are cut with a <mask> rather than painted in a second
    colour — so the holes are genuinely transparent and the mark sits on any
    background, light or dark, without a halo. Set colour with CSS `color`.
  -->
  <defs>
    <mask id="sc-knockout">
      <rect width="64" height="64" fill="#fff"/>
      <g fill="#000">
        <!-- the flower, at the canonical chapter-04 proportions -->
        <circle cx="32"     cy="15.312"  r="4.514"/>
        <circle cx="39.314" cy="20.624"  r="4.514"/>
        <circle cx="36.519" cy="29.220"  r="4.514"/>
        <circle cx="27.481" cy="29.220"  r="4.514"/>
        <circle cx="24.687" cy="20.624"  r="4.514"/>
        <circle cx="32"     cy="23"      r="1.984"/>
        <!-- the dispenser door -->
        <circle cx="32" cy="48.6" r="3.7"/>
      </g>
    </mask>
  </defs>

  <g fill="currentColor" mask="url(#sc-knockout)">
    <circle cx="32" cy="23" r="18"/>
    <rect x="20.5" y="36.5" width="23" height="5.5" rx="2.4"/>
    <path d="M22,41.5 H42 C44,47 46,51.2 48.2,55.6 H15.8 C18,51.2 20,47 22,41.5 Z"/>
    <rect x="13" y="54.6" width="38" height="5.2" rx="2.6"/>
  </g>
</svg>
