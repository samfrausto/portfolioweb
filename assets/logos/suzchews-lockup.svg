<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80" width="64" height="80"
     role="img" aria-label="SuzChews">
  <title>SuzChews</title>
  <!--
    SuzChews lockup A — "Matched". Approved 2026-08-05.
    Machine above, name directly below. The wordmark is tracked with
    textLength + lengthAdjust="spacing" to exactly 38 units, the width of the
    machine's foot, so the name is precisely as wide as the machine stands.
    That shared edge is what makes a stacked lockup read as drawn rather than
    assembled. lengthAdjust="spacing" moves the letters apart; it does NOT
    stretch the glyphs — this is optical tracking, not distortion.

    FONT: the wordmark is live text in Syne 800. Inline this file in a page
    that already loads Syne (every page in this portfolio does) and it is
    exact. Used as a standalone <img> on a machine without Syne installed, it
    falls back to the local grotesque, which is close but not the real mark.
    A stacked lockup is never a favicon — use suzchews-mark.svg for that.
  -->
  <defs>
    <symbol id="sc-bloom" viewBox="0 0 100 100">
      <g fill="var(--ink-bloom, #ECC74A)">
        <circle cx="50"    cy="19"    r="18.2"/>
        <circle cx="79.49" cy="40.42" r="18.2"/>
        <circle cx="68.22" cy="75.08" r="18.2"/>
        <circle cx="31.78" cy="75.08" r="18.2"/>
        <circle cx="20.51" cy="40.42" r="18.2"/>
        <circle cx="50"    cy="50"    r="8"/>
      </g>
    </symbol>
  </defs>

  <g fill="var(--ink-body, #C26070)">
    <circle cx="32" cy="23" r="18"/>
    <rect x="20.5" y="36.5" width="23" height="5.5" rx="2.4"/>
    <path d="M22,41.5 H42 C44,47 46,51.2 48.2,55.6 H15.8 C18,51.2 20,47 22,41.5 Z"/>
    <rect x="13" y="54.6" width="38" height="5.2" rx="2.6"/>
  </g>
  <circle cx="32" cy="48.6" r="3.7" fill="var(--ink-knock, #FDFAF8)"/>
  <use href="#sc-bloom" x="19.6" y="10.6" width="24.8" height="24.8"/>

  <text x="32" y="74.5" text-anchor="middle" textLength="38" lengthAdjust="spacing"
        font-family="Syne, Syne Variable, ui-sans-serif, system-ui, sans-serif"
        font-weight="800" font-size="9.4"
        fill="var(--ink-text, #2C1F1A)">SuzChews</text>
</svg>
